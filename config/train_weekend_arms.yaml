# Weekend round-2 arm sweep — independent one-lever arms off the FULL-FRAME
# base (the 2026-08-06 ROI verdict: ROI training LOST to ladder lite1 by 0.8
# in-spot AP on identical cropped-val GT — ladder lite1 stays champion).
# All arms judged Monday by eval_inspot.py; winners compose into the next
# recipe. Gate: ladder lite1 in-spot 69.1 strict / 88.7 AP50 (full-frame val).
#
# The full-frame lite1 arms share the session split; lite2 needs no split
# change either (full-frame). The one roi arm rebuilds its own local split.
#
# Rough wall-clock on the 3090: ~4.5h per lite1 arm, ~7h lite2, ~10h 3x
# ≈ 40 h total.
levels:
  - {name: lite1-a20,  model: lite1, anchor_scale: 2.0}   # anchor-fit analysis:
  - {name: lite1-a15,  model: lite1, anchor_scale: 1.5}   # 36% of car boxes
                                                          # unmatchable at 3.0
  - {name: lite1-ema,  model: lite1, extra_args: "--workers 4 --model-ema"}
  - {name: lite1-3x,   model: lite1, train_steps_budget: 75000}
  - {name: lite1-fill0, model: lite1, extra_args: "--workers 4 --fill-color 0"}
    # FW letterboxes BLACK; effdet default pads ImageNet-mean gray
  - {name: lite2-sum,  model: lite2, fpn_name: bifpn_sum}  # <=4s latency
                                                           # challenger

base_data_path: data/images
annotated_files: auto
split_by: sensor-hash
split_salt: falcon-v1          # never change
train_val_split: 0.8
val_max_images: 5000
seed: 42

include_coco: false
label_source: sam3-drafts-roi-arms

output_dir: runs
pretrained: True
pretrained_backbone: True
batch_size: 8
epochs: auto
train_steps_budget: 25000
min_epochs: 2
amp: true
extra_args: "--workers 4"
export_after_training: false   # experiment arms — winners get exported when
                               # they graduate (anchor/fpn arms need packager
                               # flag plumbing first anyway)
