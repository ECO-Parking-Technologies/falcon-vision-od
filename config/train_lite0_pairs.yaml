# lite0 lever PAIRS — completes the 2^3 ablation lattice with the singles
# (session 20260811-091840) and the rejected triple (62.8/82.7).
# Gate: ladder lite0 in-spot 63.8 strict / 84.6 AP50.
levels:
  - {name: lite0-a20-3x,    model: lite0, anchor_scale: 2.0,
     train_steps_budget: 75000}
  - {name: lite0-a20-fill0, model: lite0, anchor_scale: 2.0,
     extra_args: "--workers 4 --fill-color 0"}
  - {name: lite0-3x-fill0,  model: lite0, train_steps_budget: 75000,
     extra_args: "--workers 4 --fill-color 0"}

base_data_path: data/images
annotated_files: auto
split_by: sensor-hash
split_salt: falcon-v1          # never change
train_val_split: 0.8
val_max_images: 5000
seed: 42

include_coco: false
label_source: sam3-drafts-lite0-pairs

output_dir: runs
pretrained: True
pretrained_backbone: True
batch_size: 8
epochs: auto
train_steps_budget: 25000
min_epochs: 2
amp: true
extra_args: "--workers 4"
export_after_training: false   # ablation only — a winner gets packaged
                               # deliberately afterward
