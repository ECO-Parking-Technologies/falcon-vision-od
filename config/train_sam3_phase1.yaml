# Round-0 prove-out: lite0 distilled from SAM 3 drafts, phase-1 queue (~4.1k
# frames), garage data ONLY (no COCO mix — this measures what SAM3 labels
# teach). Eval on the val split is vs SAM3 labels too, i.e. distillation
# fidelity — honest accuracy comes from human-audited gold later.
base_data_path: data/images
annotated_files: auto        # every <garage>/<sensor>/preannotations.coco.json
split_by: sensor             # whole sensors to one side: no camera leakage
train_val_split: 0.8
seed: 42
include_coco: false
label_source: sam3-drafts-phase1

output_dir: runs
model: tf_efficientdet_lite0
pretrained: True             # fine-tune from the COCO detector checkpoint
pretrained_backbone: True
batch_size: 8
epochs: 50
amp: true
extra_args: "--workers 4"
export_after_training: true
